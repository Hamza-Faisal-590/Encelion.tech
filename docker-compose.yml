version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: encelion-postgres
    restart: always
    environment:
      POSTGRES_USER: encelion
      POSTGRES_PASSWORD: encelion_password
      POSTGRES_DB: encelion_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: encelion-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: encelion-api
    restart: always
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://encelion:encelion_password@postgres:5432/encelion_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-jwt-key-change-in-prod-encelion-2026
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: encelion-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: encelion-admin
    restart: always
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
